services:
  zoraxy:
    image: ${ZORAXY_IMAGE:?Set a versioned image with sha256 digest}
    container_name: zoraxy-ha
    restart: "no"
    environment:
      DB: boltdb
      ENABLELOG: "false"
      FASTGEOIP: "true"
      MDNS: "false"
      PORT: "${ZORAXY_MANAGEMENT_PORT:-8000}"
      TZ: "${TZ:-Etc/UTC}"
      ZORAXY_NODE_ROLE: active-passive
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
      - "${ZORAXY_MANAGEMENT_IP:-0.0.0.0}:${ZORAXY_MANAGEMENT_PORT:-8000}:${ZORAXY_MANAGEMENT_PORT:-8000}/tcp"
    volumes:
      - "/srv/zoraxy:/opt/zoraxy/config"
      - "/srv/zoraxy/plugins:/opt/zoraxy/plugin"
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - NET_RAW
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:${ZORAXY_MANAGEMENT_PORT:-8000}/health/ready"]
      start_period: 15s
      interval: 10s
      timeout: 3s
      retries: 3
    stop_grace_period: 30s
